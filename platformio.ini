; Live NFL / College Football score tracker — Hosyond ESP32-S3 2.8" touchscreen
; See HOSYOND_ESP32S3_BOARD.md section 3a for why the platform + board id are pinned.

[env:esp32-s3-devkitc-1]
platform = espressif32@6.6.0        ; MUST be pinned — newer core regresses on this board
board = esp32-s3-devkitc-1          ; MUST be the plain id (no -n16r8v variant)
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1            ; hardware CDC/JTAG — stable serial
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
    -DCORE_DEBUG_LEVEL=3

board_build.arduino.memory_type = qio_opi   ; QIO flash + OPI (octal) PSRAM
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv       ; 3 MB single app, no OTA needed

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bblanchon/ArduinoJson @ ^7.2.0
    adafruit/Adafruit NeoPixel @ ^1.12.3
